<div class="form-page">
  <div class="form-card">
    <div class="form-header">
      <h1>Welcome Back</h1>
      <h3>Login Here</h3>
    </div>
    <form name="form" (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
      <div>
        <div class="field">
          <label for="username">Email</label>
          <input required type="text" name="username" id="username" autocomplete="username"
                 [(ngModel)]="form.username" #username="ngModel">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" name="password" id="password" autocomplete="current-password"
                 [(ngModel)]="form.password" required #password="ngModel">
        </div>
      </div>
      <button class="btn btn-block">Submit</button>
    </form>
  </div>
</div>
