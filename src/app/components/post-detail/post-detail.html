<article class="story">
  <a href="/" class="back-link"><span aria-hidden="true">&larr;</span> Back to Posts</a>

  <header class="story-head">
    <h1 class="story-title"><a href="/posts/{{ post?.id }}"> {{ post?.title }} </a></h1>
    <p class="story-byline meta">
      <span class="story-author">by {{ post?.firstName }} {{ post?.lastName }}</span>
      <span class="sep" aria-hidden="true">&middot;</span>
      <span>{{ post?.dateCreated | date:'MMMM d, y · h' }}{{ post?.dateCreated | date:'a' | lowercase }}</span>
    </p>
  </header>

  <hr class="rule" />

  <p class="story-body">{{ post?.body }}</p>
</article>
