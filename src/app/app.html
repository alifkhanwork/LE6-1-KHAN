<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="site-name" aria-label="Khan Blog home">
      <span class="logo" title="Mohammad Khan" aria-hidden="true">MK</span>
      <span>Khan Blog</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      @if (isLoggedIn()) {
        <a routerLink="/" (click)="logout()">Logout</a>
      } @else {
        <a routerLink="/login" routerLinkActive="is-active">Login</a>
        <a routerLink="/register" routerLinkActive="is-active">Register</a>
      }
    </nav>
  </div>
</header>

<main class="container page">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span>Mohammad Khan</span>
    <span class="footer-sep" aria-hidden="true">&bull;</span>
    <span>ITS152P</span>
    <span class="footer-sep" aria-hidden="true">&bull;</span>
    <span>2026</span>
  </div>
</footer>
